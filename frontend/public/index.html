<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maison Élan — A Seasonal Table</title>
<meta name="description" content="Maison Élan — modern European dining, seasonal menus, table reservations and collection orders.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F7F3EB;--white:#FFFCF7;--green:#193D32;--ink:#242521;--gold:#B69A63;--sage:#DDE4D8;--taupe:#6f6657;--red:#8C3439;--line:#e3dccd;--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ivory);color:var(--ink);font:16px/1.6 var(--sans)}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.1;margin:0 0 .5em}h1{font-size:clamp(2.6rem,6vw,5rem)}h2{font-size:clamp(2rem,4vw,3rem)}h3{font-size:1.5rem}
a{color:inherit}.wrap{max-width:1360px;margin:0 auto;padding:0 24px}.narrow{max-width:720px}
.eyebrow{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--taupe);font-weight:700}
.btn{display:inline-block;border:1px solid var(--green);background:var(--green);color:#fff;padding:12px 24px;font:700 .85rem var(--sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn:hover{background:#0f2b23}.btn.ghost{background:transparent;color:var(--green)}.btn.light{background:transparent;color:#fff;border-color:#fff}.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{background:var(--green);color:#e8e1cf;text-align:center;font-size:.8rem;padding:6px 12px}
header{position:sticky;top:0;z-index:20;background:var(--ivory);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:24px;height:72px}.logo{font:600 1.7rem var(--serif);text-decoration:none;color:var(--green);margin-right:auto}
nav{display:flex;gap:22px}nav a{text-decoration:none;font-size:.9rem;padding:4px 0;border-bottom:2px solid transparent}nav a.on,nav a:hover{border-color:var(--gold)}
.cartbtn{background:none;border:1px solid var(--line);padding:8px 14px;cursor:pointer;font:700 .85rem var(--sans)}
.burger{display:none;background:none;border:0;font-size:1.6rem;cursor:pointer}
@media(max-width:900px){nav{display:none;position:absolute;top:72px;left:0;right:0;background:var(--ivory);flex-direction:column;padding:16px 24px;border-bottom:1px solid var(--line)}nav.open{display:flex}.burger{display:block}}
.hero{position:relative;min-height:78vh;display:flex;align-items:flex-end;color:#fff;background:#111 center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,25,20,.85),rgba(10,25,20,.2))}
.hero .wrap{position:relative;padding-bottom:64px}.hero p{max-width:560px;font-size:1.1rem}.hero .eyebrow{color:var(--gold)}
section.s{padding:80px 0}.green{background:var(--green);color:#fff}.green .eyebrow{color:var(--gold)}
.grid{display:grid;gap:28px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.split{display:grid;gap:48px;grid-template-columns:1fr 1fr;align-items:center}@media(max-width:800px){.split{grid-template-columns:1fr}}
.split img{width:100%;height:520px;object-fit:cover}
.card{background:var(--white);border:1px solid var(--line);display:flex;flex-direction:column}
.card .ph{aspect-ratio:4/3;overflow:hidden;background:var(--sage)}.card img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover img{transform:scale(1.04)}
.noimg{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--green);background:repeating-linear-gradient(135deg,var(--sage),var(--sage) 12px,#d3dccf 12px,#d3dccf 13px);text-align:center;padding:12px}
.noimg b{font:500 1.3rem var(--serif)}.noimg small{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--taupe)}
.card .b{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}.card h3{margin:0}.price{font-weight:700;color:var(--green)}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:.7rem;background:var(--sage);padding:2px 8px;color:var(--green)}.tag.warn{background:#f0dede;color:var(--red)}
.row{display:flex;gap:10px;align-items:center;margin-top:auto;flex-wrap:wrap;justify-content:space-between}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.chip{border:1px solid var(--line);background:var(--white);padding:8px 16px;cursor:pointer;font:500 .85rem var(--sans)}.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
input,select,textarea{font:inherit;padding:11px 12px;border:1px solid #cfc6b2;background:var(--white);width:100%}label{display:block;font-size:.85rem;font-weight:700;margin:14px 0 4px}
.filters input,.filters select{width:auto;min-width:200px}
.notice{border-left:3px solid var(--gold);background:var(--white);padding:12px 16px;font-size:.88rem;color:var(--taupe);margin:16px 0}
.err{color:var(--red);font-weight:500;margin-top:10px}.ok{background:var(--sage);padding:20px;border-left:4px solid var(--green)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--white);z-index:40;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}.drawer.open{transform:none}
.drawer .in{padding:20px;overflow:auto;flex:1}.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;cursor:pointer}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}.scrim.on{display:block}
.steps{display:flex;gap:8px;margin:20px 0}.steps i{flex:1;height:4px;background:var(--line)}.steps i.on{background:var(--gold)}
.slots{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;z-index:60;font-size:.9rem}
.detail{display:grid;gap:48px;grid-template-columns:1fr 1fr}@media(max-width:800px){.detail{grid-template-columns:1fr}}.detail .ph{aspect-ratio:4/3;background:var(--sage)}.detail img{width:100%;height:100%;object-fit:cover}
table{border-collapse:collapse;width:100%}td{padding:8px 0;border-bottom:1px solid var(--line)}
footer{background:var(--green);color:#d9d2bf;padding:56px 0 24px;font-size:.9rem}footer h3{color:#fff}footer a{color:#fff}.fgrid{display:grid;gap:32px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fine{border-top:1px solid #35574b;margin-top:32px;padding-top:16px;font-size:.78rem;color:#a9b6ac}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body>
<div class="bar" id="bar"></div>
<header><div class="wrap"><a class="logo" href="#/">Maison Élan</a>
<nav id="nav"><a href="#/" data-r="">Home</a><a href="#/story" data-r="story">Our Story</a><a href="#/menu" data-r="menu">Menu</a><a href="#/reserve" data-r="reserve">Reservations</a><a href="#/private" data-r="private">Private Dining</a><a href="#/contact" data-r="contact">Contact</a></nav>
<a class="btn" href="#/menu" style="padding:9px 16px">Order Online</a><button class="cartbtn" id="cartbtn" aria-label="Open basket">Basket (<span id="cc">0</span>)</button><button class="burger" id="burger" aria-label="Menu">☰</button></div></header>
<main id="app"></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Basket"><div class="in" id="drawerIn"></div></aside>
<footer><div class="wrap"><div class="fgrid" id="foot"></div><div class="fine" id="fine"></div></div></footer>
<script>
const $=s=>document.querySelector(s),app=$('#app');let INFO,MENU=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp=n=>'£'+Number(n).toFixed(2);
async function api(p,o){const r=await fetch('/api'+p,o&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Something went wrong. Please try again.');return d}
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
let cart=[];try{cart=JSON.parse(localStorage.getItem('me_cart')||'[]')}catch{}
const saveCart=()=>{try{localStorage.setItem('me_cart',JSON.stringify(cart))}catch{}$('#cc').textContent=cart.reduce((a,l)=>a+l.quantity,0)};
const find=s=>MENU.find(m=>m.slug===s);
function add(slug){const m=find(slug);if(!m||!m.available)return toast('Sorry, this dish is unavailable');const l=cart.find(x=>x.slug===slug);l?l.quantity=Math.min(20,l.quantity+1):cart.push({slug,quantity:1});saveCart();toast(m.name+' added to basket')}
function img(m,alt){return m.image?`<img src="${m.image}" alt="${esc(alt||m.image_alt||m.name)}" loading="lazy">`:`<div class="noimg"><b>${esc(m.name)}</b><small>Photograph to follow</small></div>`}
function tags(m){return `<div class="tags">${m.dietary_tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${m.available?'':'<span class="tag warn">Currently unavailable</span>'}</div>`}
const dish=m=>`<article class="card"><a class="ph" href="#/dish/${m.slug}" style="display:block">${img(m)}</a><div class="b"><span class="eyebrow">${esc(m.category)}</span><h3><a href="#/dish/${m.slug}" style="text-decoration:none">${esc(m.name)}</a></h3><p style="margin:0;color:var(--taupe);font-size:.92rem">${esc(m.short_description)}</p>${tags(m)}<div class="row"><span class="price">${gbp(m.price)}</span><span><a class="btn ghost" href="#/dish/${m.slug}" style="padding:8px 12px">Details</a> <button class="btn" style="padding:8px 12px" data-add="${m.slug}" ${m.available?'':'disabled'}>Add</button></span></div></div></article>`;
document.addEventListener('click',e=>{const a=e.target.closest('[data-add]');if(a)add(a.dataset.add);if(e.target.closest('#nav a'))$('#nav').classList.remove('open')});
$('#burger').onclick=()=>$('#nav').classList.toggle('open');
// Basket drawer
function drawer(open){$('#drawer').classList.toggle('open',open);$('#scrim').classList.toggle('on',open);if(open)renderCart()}
$('#cartbtn').onclick=()=>drawer(true);$('#scrim').onclick=()=>drawer(false);document.addEventListener('keydown',e=>e.key==='Escape'&&drawer(false));
function renderCart(){const L=cart.map(l=>({...l,m:find(l.slug)})).filter(l=>l.m);const sub=L.reduce((a,l)=>a+l.m.price*l.quantity,0);
$('#drawerIn').innerHTML=`<div class="row" style="margin:0"><h2 style="margin:0;font-size:2rem">Your basket</h2><button class="chip" onclick="drawer(false)">Close</button></div>`+(L.length?L.map(l=>`<div class="line"><div><b>${esc(l.m.name)}</b><br><small>${gbp(l.m.price)} each</small>${l.m.available?'':'<br><span class="err">Unavailable — remove to continue</span>'}</div><div class="qty"><button data-q="${l.slug}" data-d="-1" aria-label="Decrease">−</button> ${l.quantity} <button data-q="${l.slug}" data-d="1" aria-label="Increase">+</button></div></div>`).join('')+`<div class="line"><b>Subtotal</b><b>${gbp(sub)}</b></div><p class="notice">Collection only. Payment is taken at the restaurant. The server re-checks prices and availability when you place the order.</p><a class="btn" href="#/checkout" onclick="drawer(false)">Checkout</a>`:'<p>Your basket is empty. <a href="#/menu" onclick="drawer(false)">Explore the menu</a></p>')}
$('#drawerIn').onclick=e=>{const b=e.target.closest('[data-q]');if(!b)return;const l=cart.find(x=>x.slug===b.dataset.q);l.quantity+=+b.dataset.d;if(l.quantity<1)cart=cart.filter(x=>x!==l);if(l&&l.quantity>20)l.quantity=20;saveCart();renderCart()};
// Pages
const pages={
home(){const c=INFO.content.home,f=MENU.filter(m=>m.featured).slice(0,4);return `<section class="hero" style="background-image:url(/images/hero/dining-room-evening.jpg)"><div class="wrap"><div class="eyebrow">${esc(c.hero_eyebrow)}</div><h1>${esc(c.hero_title)}</h1><p>${esc(c.hero_body)}</p><p><a class="btn light" href="#/reserve">${esc(c.primary_cta)}</a> <a class="btn" style="background:var(--gold);border-color:var(--gold);color:#16241f" href="#/menu">${esc(c.secondary_cta)}</a></p></div></section>
<section class="s"><div class="wrap split"><div><div class="eyebrow">Our philosophy</div><h2>${esc(c.intro_title)}</h2><p>${esc(c.intro_body)}</p><a class="btn ghost" href="#/story">Our story</a></div><img src="/images/restaurant/dining-room-timber-ceiling.jpg" alt="Dining room with a sculpted timber ceiling"></div></section>
<section class="s" style="background:var(--white)"><div class="wrap"><div class="eyebrow">Signature dishes</div><h2>${esc(c.seasonal_title)}</h2><p class="narrow">${esc(c.seasonal_body)}</p><div class="grid">${f.map(dish).join('')}</div><p><a class="btn" href="#/menu">View the full menu</a></p></div></section>
<section class="s"><div class="wrap split"><img src="/images/journal/service-green-curtain.jpg" alt="Server carrying plates in front of a green curtain"><div><div class="eyebrow">The experience</div><h2>${esc(c.experience_title)}</h2><p>${esc(c.experience_body)}</p><a class="btn ghost" href="#/private">Private dining enquiry</a></div></div></section>
<section class="s green"><div class="wrap" style="text-align:center"><div class="eyebrow">Reservations</div><h2>${esc(c.closing_cta)}</h2><p>Check live availability and book in under a minute.</p><a class="btn light" href="#/reserve">Reserve a table</a></div></section>`},
story(){const s=INFO.content.story;return `<section class="s"><div class="wrap narrow"><div class="eyebrow">Our story</div><h1>${esc(s.title)}</h1><p style="font-size:1.2rem">${esc(s.lead)}</p></div><div class="wrap"><img src="/images/restaurant/dining-room-windows.jpg" alt="Dining room with tall windows" style="width:100%;height:420px;object-fit:cover;margin:32px 0"></div><div class="wrap narrow">${s.sections.map(x=>`<h3>${esc(x.heading)}</h3><p>${esc(x.body)}</p>`).join('')}<p class="notice">Hosted by ${esc(INFO.owner)}, proprietor.</p></div></section>`},
menu(){return `<section class="s"><div class="wrap"><div class="eyebrow">Seasonal &amp; classic</div><h1>Our Menu</h1><p class="notice">Dietary tags and allergen information are illustrative demo data, not verified declarations. If you have an allergy, please contact the restaurant before ordering.</p><div class="filters"><input id="q" type="search" placeholder="Search dishes or ingredients" aria-label="Search"><select id="diet" aria-label="Dietary"><option value="">Any dietary</option><option value="vegetarian">Vegetarian</option><option value="vegan">Vegan</option><option value="gluten">Gluten-free</option></select><select id="sort" aria-label="Sort"><option value="">Menu order</option><option value="price">Price: low to high</option><option value="name">Name A–Z</option></select></div><div class="filters" id="cats"></div><div class="grid" id="list"></div></div></section>`},
async dish(slug){let m;try{m=await api('/menu/'+encodeURIComponent(slug))}catch(e){return `<section class="s"><div class="wrap"><h1>Dish not found</h1><a class="btn" href="#/menu">Back to the menu</a></div></section>`}
const st=a=>/^contains$|contains with|contains\b/.test(a.status)&&!/verify|or verify|if /.test(a.status)?'Contains':'Not yet verified';
return `<section class="s"><div class="wrap"><a href="#/menu">← Menu</a><div class="detail" style="margin-top:20px"><div class="ph">${img(m)}</div><div><span class="eyebrow">${esc(m.category)} · ${esc(m.subcategory)}</span><h1 style="font-size:3rem">${esc(m.name)}</h1><p class="price" style="font-size:1.5rem">${gbp(m.price)}</p>${tags(m)}<p>${esc(m.description)}</p><p><small>${esc(m.serving)}</small></p><button class="btn" data-add="${m.slug}" ${m.available?'':'disabled'}>${m.available?'Add to order':'Currently unavailable'}</button>
<h3 style="margin-top:32px">Ingredients</h3><p>${m.ingredients.map(esc).join(', ')}</p><h3>Allergen information</h3><table>${m.allergens.map(a=>`<tr><td>${esc(a.name)}</td><td style="text-align:right">${a.status==='contains'?'Contains':esc(a.status)}</td></tr>`).join('')||'<tr><td>None listed</td></tr>'}</table><p class="notice">Demo data — not a verified allergen declaration. “None listed” never means safe for an allergy. Please ask the restaurant.</p>${m.chef_notes?`<p><i>Chef's note: ${esc(m.chef_notes)}</i></p>`:''}<p class="notice">Reviews are not yet available for this dish.</p></div></div></div></section>`},
checkout(){const L=cart.map(l=>({...l,m:find(l.slug)})).filter(l=>l.m);if(!L.length)return `<section class="s"><div class="wrap"><h1>Your basket is empty</h1><a class="btn" href="#/menu">Explore the menu</a></div></section>`;const sub=L.reduce((a,l)=>a+l.m.price*l.quantity,0);
return `<section class="s"><div class="wrap narrow"><h1>Checkout</h1><p class="eyebrow">Collection order</p>${L.map(l=>`<div class="line"><span>${l.quantity} × ${esc(l.m.name)}</span><b>${gbp(l.m.price*l.quantity)}</b></div>`).join('')}<div class="line"><b>Total</b><b>${gbp(sub)}</b></div><p class="notice">Pay on collection. Your order is only confirmed once the restaurant accepts it — you will see its status below.</p><form id="f"><label>Name<input name="name" required maxlength="80" autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Phone (optional)<input name="phone" autocomplete="tel"></label><label>Notes for the kitchen (optional)<textarea name="notes" maxlength="500" rows="3"></textarea></label><p><button class="btn" id="go">Place order</button></p><div id="msg" role="alert"></div></form></div></section>`},
reserve(){return `<section class="s"><div class="wrap narrow"><div class="eyebrow">Reservations</div><h1>Reserve a table</h1><div class="steps"><i class="on"></i><i id="s2"></i><i id="s3"></i></div><div id="step"></div></div></section>`},
private(){return form(INFO.content.private_dining.title,INFO.content.private_dining.lead+' '+INFO.content.private_dining.workflow,'private_dining')},
contact(){const c=INFO.contact;return `<section class="s"><div class="wrap split" style="align-items:start"><div><div class="eyebrow">Contact</div><h1>${esc(INFO.content.contact.title)}</h1><p><b>${esc(INFO.owner)}</b> — proprietor<br><a href="mailto:${esc(c.email)}">${esc(c.email)}</a><br>${esc(c.phone)}<br>${esc(c.address)}</p><h3>Opening hours</h3><table>${INFO.opening_hours.map(h=>`<tr><td>${h.day}</td><td style="text-align:right">${h.status==='open'?h.open+' – '+h.close:'Closed'}</td></tr>`).join('')}</table></div><div>${formBody('contact')}</div></div></section>`}};
function formBody(kind){const pd=kind==='private_dining';return `<form id="cf" data-kind="${kind}"><label>Name<input name="name" required maxlength="80"></label><label>Email<input name="email" type="email" required></label>${pd?'<label>Preferred date<input name="date" type="date"></label><label>Number of guests<input name="guests" type="number" min="9" max="60" placeholder="9 or more"></label><label>Occasion<input name="occasion"></label>':'<label>Subject<input name="subject" maxlength="120"></label>'}<label>Message<textarea name="message" required rows="5" maxlength="3000"></textarea></label><p><button class="btn">Send ${pd?'enquiry':'message'}</button></p><div id="msg" role="alert"></div></form>`}
function form(t,lead,kind){return `<section class="s"><div class="wrap narrow"><div class="eyebrow">${kind==='private_dining'?'Celebrations':'Contact'}</div><h1>${esc(t)}</h1><p>${esc(lead)}</p><img src="/images/restaurant/dining-room-green.jpg" alt="Dining room with green banquette seating" style="width:100%;height:320px;object-fit:cover;margin:16px 0">${formBody(kind)}</div></section>`}
// Page behaviours
const after={
menu(){let cat='',el=$('#list');const cats=['All',...INFO.categories];$('#cats').innerHTML=cats.map(c=>`<button class="chip ${(c==='All'&&!cat)?'on':''}" data-c="${c}">${c}</button>`).join('');
async function load(){const p=new URLSearchParams({category:cat,q:$('#q').value,diet:$('#diet').value,sort:$('#sort').value});el.innerHTML='<p>Loading…</p>';try{const d=await api('/menu?'+p);MENU=MENU.length?MENU:d.items;el.innerHTML=d.items.length?d.items.map(dish).join(''):'<p>No dishes match your search. Try clearing a filter.</p>'}catch(e){el.innerHTML=`<p class="err">${esc(e.message)} <button class="chip" id="retry">Retry</button></p>`;$('#retry').onclick=load}}
$('#cats').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c==='All'?'':b.dataset.c;document.querySelectorAll('#cats .chip').forEach(x=>x.classList.toggle('on',x===b));load()};
let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(load,250)};$('#diet').onchange=$('#sort').onchange=load;load()},
checkout(){const f=$('#f');if(!f)return;const key=crypto.randomUUID();f.onsubmit=async e=>{e.preventDefault();const b=$('#go');b.disabled=true;$('#msg').textContent='';const d=Object.fromEntries(new FormData(f));
try{const r=await api('/orders',{...d,items:cart,idempotency_key:key});cart=[];saveCart();f.outerHTML=`<div class="ok"><h2>Order received</h2><p>Order <b>${r.order_number}</b> · ${gbp(r.total)} · status: <b>${r.status.replace(/_/g,' ')}</b>. The restaurant will confirm your order; pay on collection.</p><a class="btn" href="#/menu">Back to the menu</a></div>`}catch(x){$('#msg').innerHTML=`<p class="err">${esc(x.message)}</p>`;b.disabled=false}}},
reserve(){const S={party:2,date:''};const el=$('#step');const today=new Date().toISOString().slice(0,10);
el.innerHTML=`<label>Date<input type="date" id="d" min="${today}"></label><label>Guests<select id="p">${[1,2,3,4,5,6,7,8].map(n=>`<option ${n===2?'selected':''}>${n}</option>`).join('')}</select></label><p class="notice">For more than 8 guests, please use <a href="#/private">Private Dining</a>.</p><p><button class="btn" id="chk">Check availability</button></p><div id="sl"></div>`;
$('#chk').onclick=async()=>{S.date=$('#d').value;S.party=+$('#p').value;if(!S.date)return $('#sl').innerHTML='<p class="err">Please choose a date.</p>';$('#sl').innerHTML='Checking…';
try{const r=await api(`/reservations/availability?date=${S.date}&party=${S.party}`);$('#sl').innerHTML=r.slots.length?`<h3>Available times</h3><div class="slots">${r.slots.map(s=>`<button class="chip" data-t="${s.time}">${s.time}</button>`).join('')}</div>`:`<p class="err">${esc(r.reason||'No tables available on this date.')}</p>`}catch(e){$('#sl').innerHTML=`<p class="err">${esc(e.message)}</p>`}};
el.onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;S.time=b.dataset.t;$('#s2').classList.add('on');
el.innerHTML=`<h3>${S.party} guests · ${S.date} · ${S.time}</h3><form id="rf"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone (optional)<input name="phone"></label><label>Occasion (optional)<input name="occasion"></label><label>Special requests (optional — not guaranteed)<textarea name="notes" rows="3"></textarea></label><p class="notice">Your booking is confirmed only when the server replies “confirmed”. Allergies: please contact the restaurant directly.</p><p><button class="btn" id="rb">Confirm reservation</button> <a class="btn ghost" href="#/reserve" onclick="route()">Back</a></p><div id="msg" role="alert"></div></form>`;
$('#rf').onsubmit=async ev=>{ev.preventDefault();$('#rb').disabled=true;$('#s3').classList.add('on');try{const r=await api('/reservations',{...Object.fromEntries(new FormData(ev.target)),party_size:S.party,date:S.date,time:S.time});el.innerHTML=`<div class="ok"><h2>Table ${r.status}</h2><p>Reference <b>${r.reservation_number}</b> — ${r.party_size} guests on ${r.date} at ${r.time}.</p></div>`}catch(x){$('#msg').innerHTML=`<p class="err">${esc(x.message)}</p>`;$('#rb').disabled=false}}}},
private(){after.contact()},
contact(){const f=$('#cf');f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));if(f.dataset.kind==='private_dining')d.message=`Private dining enquiry. Date: ${d.date||'flexible'}; guests: ${d.guests||'?'}; occasion: ${d.occasion||'-'}.\n`+d.message;d.kind=f.dataset.kind;
try{await api('/contact',d);f.outerHTML='<div class="ok"><h2>Thank you</h2><p>Your message has been received. This is an enquiry only — nothing is confirmed until the team replies.</p></div>'}catch(x){$('#msg').innerHTML=`<p class="err">${esc(x.message)}</p>`}}}};
async function route(){const [r,a]=(location.hash.slice(2)||'').split('/');drawer(false);document.querySelectorAll('#nav a').forEach(x=>x.classList.toggle('on',x.dataset.r===(r||'')));
try{app.innerHTML=await (pages[r||'home']||pages.home)(a)}catch(e){app.innerHTML=`<section class="s"><div class="wrap"><h1>Something went wrong</h1><p>${esc(e.message)}</p><button class="btn" onclick="route()">Try again</button></div></section>`}
document.title=(r?r[0].toUpperCase()+r.slice(1)+' · ':'')+'Maison Élan';window.scrollTo(0,0);app.focus&&after[r]&&after[r](a)}
function foot(){const c=INFO.contact;$('#foot').innerHTML=`<div><h3>Maison Élan</h3><p>${esc(INFO.tagline)}</p></div><div><h3>Visit</h3><p>${esc(c.address)}<br><a href="mailto:${esc(c.email)}">${esc(c.email)}</a><br>${esc(c.phone)}</p></div><div><h3>Hours</h3>${INFO.opening_hours.map(h=>`<div>${h.day.slice(0,3)} ${h.status==='open'?h.open+'–'+h.close:'Closed'}</div>`).join('')}</div><div><h3>Explore</h3><a href="#/menu">Menu</a><br><a href="#/reserve">Reservations</a><br><a href="#/private">Private dining</a><br><a href="#/contact">Contact</a></div>`;
$('#fine').innerHTML=`© ${new Date().getFullYear()} Maison Élan · Proprietor ${esc(INFO.owner)}. ${esc(INFO.content.policies.allergens)} ${esc(INFO.demo_notice)}`}
(async()=>{try{INFO=await api('/info');MENU=(await api('/menu')).items;$('#bar').textContent=INFO.content.home.announcement;foot();saveCart();window.addEventListener('hashchange',route);route()}catch(e){app.innerHTML='<section class="s"><div class="wrap"><h1>We will be right back</h1><p>The site could not load. Please refresh.</p></div></section>'}})();
</script><script src="/app2.js"></script><script src="/admin.js"></script></body></html>
